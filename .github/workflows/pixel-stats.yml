# Re-draws the pixel-art stats panels (assets/high-scores.svg, assets/combo-meter.svg)
# from live GitHub data once a day and commits them if anything changed.
#
# GITHUB_TOKEN only sees what a public visitor sees. To count private contributions
# the same way your profile does, add a fine-grained token as the STATS_TOKEN secret.
name: Refresh pixel stats

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Draw assets
        run: python scripts/build_assets.py
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets
            git commit -m 'Refresh pixel stats'
            git push
          fi
